services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voice_ai
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://voice:voice@db:5432/voice_ai
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gpt-realtime-2.1}
      VOICE_NAME: ${VOICE_NAME:-marin}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

redis:
  image: redis:7-alpine
  restart: unless-stopped
  command: redis-server --appendonly no
  ports:
    - "6379:6379"
